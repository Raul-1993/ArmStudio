name: Compilar y verificar Windows
on: [push, pull_request, workflow_dispatch]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Compilar, verificar y preparar aplicación
        shell: powershell
        run: ./tools/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ArmStudio-Windows
          path: dist/ArmStudio
